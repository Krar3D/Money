<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة اقتصاديات النقود والبنوك التفاعلية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #111827;
      --bg-card: #1e293b;
      --bg-card-hover: #263449;
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.2);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --border-color: #334155;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 10% 10%, rgba(245, 158, 11, 0.07) 0px, transparent 40%),
        radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.07) 0px, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.7;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(9, 13, 22, 0.9) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      position: relative; 
      z-index: 100;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-gold), #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #090d16;
      box-shadow: 0 0 15px var(--accent-gold-glow);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .hud-stats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .stat-pill span.val {
      color: var(--accent-gold);
      font-size: 0.9rem;
    }

    .progress-wrapper {
      margin-top: 10px;
      background: var(--bg-card);
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
      transition: width 0.4s ease;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin: 16px 0;
    }

    .tab-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--accent-gold);
      color: var(--text-main);
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(6, 182, 212, 0.12));
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .controls-bar {
      background: rgba(17, 24, 39, 0.85); /* تعديل لجعل الخلفية شفافة قليلاً عند التمرير */
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      /* تعديلات تثبيت الشريط (Sticky) */
      position: sticky;
      top: 10px;
      z-index: 90;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
    }

    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    select, .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .action-btn:hover, select:hover {
      border-color: var(--accent-gold);
    }

    .action-btn.gold {
      background: var(--accent-gold);
      color: #090d16;
      border-color: var(--accent-gold);
      font-weight: 700;
    }

    /* MCQ Grid & Cards */
    .questions-list { display: flex; flex-direction: column; gap: 16px; }
    .q-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; position: relative; }
    .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .q-badge { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.35); padding: 2px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
    .page-badge { background: rgba(6, 182, 212, 0.12); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3); padding: 2px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    .q-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; color: var(--text-main); }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    
    .opt-btn {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 10px 14px; border-radius: 10px; text-align: right; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .opt-letter { width: 26px; height: 26px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--accent-gold); flex-shrink: 0; }
    .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #34d399; }
    .opt-btn.correct .opt-letter { background: var(--success); color: #090d16; }
    .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #f87171; }
    .opt-btn.wrong .opt-letter { background: var(--danger); color: #fff; }

    .explanation-box { margin-top: 12px; padding: 12px; border-radius: 8px; background: rgba(15, 23, 42, 0.85); border-right: 3px solid var(--accent-gold); display: none; }
    .explanation-box.show { display: block; }
    .explanation-box h4 { color: var(--accent-gold); font-size: 0.85rem; margin-bottom: 4px; }
    .explanation-box p { font-size: 0.85rem; color: #cbd5e1; }

    /* Essay Section */
    .section-view { display: none; }
    .section-view.active { display: block; }
    .essay-category-title { font-size: 1.1rem; font-weight: 800; color: var(--accent-gold); margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .essay-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .essay-card.exam-match { border-right: 4px solid var(--accent-purple); }
    .essay-header { padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.5); }
    .essay-q-text { font-size: 0.95rem; font-weight: 700; }
    .exam-tag { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); padding: 2px 8px; border-radius: 99px; font-size: 0.7rem; font-weight: 700; margin-bottom: 4px; display: inline-block;}
    .essay-body { padding: 0 16px; max-height: 0; overflow: hidden; background: var(--bg-primary); transition: max-height 0.3s ease, padding 0.3s ease; }
    .essay-card.open .essay-body { padding: 16px; max-height: 1000px; border-top: 1px solid var(--border-color); font-size: 0.9rem;}
    .key-highlight { color: var(--accent-gold); font-weight: 700; }

    @media (max-width: 768px) {
      .header-top {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brand {
        flex-direction: column;
        gap: 4px;
      }
      .brand-text h1 { font-size: 1rem; }
      .brand-text p { display: none; } 
      
      .hud-stats {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">₺</div>
          <div class="brand-text">
            <h1>مادة اقتصاديات النقود والبنوك</h1>
            <p>تحليل شامل للمحاضرة + بنك اختيارات MCQ + أسئلة الامتحانات</p>
          </div>
        </div>
        <div class="hud-stats">
          <div class="stat-pill">الصح: <span class="val" id="score-correct">0</span></div>
          <div class="stat-pill">الأسئلة: <span class="val" id="score-attempted">0</span> / <span id="total-mcq">65</span></div>
          <div class="stat-pill">النسبة: <span class="val" id="score-percent">0%</span></div>
        </div>
      </div>
      <div class="progress-wrapper">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('mcq-section', this)">
        🎯 قسم الاختيارات التفاعلي (65 MCQ)
      </button>
      <button class="tab-btn" onclick="switchTab('essay-section', this)">
        📝 الأسئلة المقالية والامتحانات
      </button>
    </div>

    <!-- SECTION 1: MCQ -->
    <section id="mcq-section" class="section-view active">
      <div class="controls-bar">
        <div class="search-box">
          <input type="text" id="mcq-search" placeholder="🔍 ابحث عن سؤال..." oninput="handleSearch()">
        </div>
        <div class="filter-group">
          <select id="page-filter" onchange="renderMCQs()">
            <option value="all">الكل (ص3 - ص19)</option>
            <option value="ص 3">ص 3: المقايضة</option>
            <option value="ص 4">ص 4: قاعدة الذهب</option>
            <option value="ص 5">ص 5: قانون جريشم</option>
            <option value="ص 6">ص 6: مداخل النقود 1</option>
            <option value="ص 7">ص 7: مداخل النقود 2</option>
            <option value="ص 8">ص 8: قياس الأثمان</option>
            <option value="ص 9">ص 9: مخزن القيمة</option>
            <option value="ص 10">ص 10: المدفوعات الآجلة</option>
            <option value="ص 11-12">ص 11-12: خصائص النقود</option>
            <option value="ص 13-14">ص 13-14: الثروة والسيولة</option>
            <option value="ص 15-16">ص 15-16: أشباه النقود و M1</option>
            <option value="ص 17-19">ص 17-19: مقاييس M2 و M3</option>
          </select>
          <button class="action-btn" onclick="revealAllMCQs()">💡 إظهار الإجابات</button>
          <button class="action-btn gold" onclick="resetMCQs()">🔄 إعادة الاختبار</button>
        </div>
      </div>

      <div class="questions-list" id="mcq-container"></div>
    </section>

    <!-- SECTION 2: ESSAY & EXAM QUESTIONS -->
    <section id="essay-section" class="section-view">
      <div id="essay-container"></div>
    </section>
  </main>

  <script>
    const mcqData = [
      // --- القديم (ص3 إلى ص10) ---
      { id: 1, page: "ص 3", q: "يهتم مقرر اقتصاديات النقود والبنوك بدراسة الترابط الوثيق بين ثلاث وحدات متكاملة في آن واحد، وهي:", options: ["النقود، البنوك، والأسواق المالية", "الذهب، الفضة، والمقايضة السلعية", "الضرائب، الإنفاق الحكومي، والتجارة الخارجية", "الأجور، الريع، والفائدة المصرفية"], ans: 0, exp: "نصت مقدمة المقرر (ص 3) على أن المقرر يدرس الترابط الوثيق بين المفاهيم الثلاثة: (النقود، البنوك، والأسواق المالية) كوحدات متكاملة لتهيئة الطالب وظيفياً." },
      { id: 2, page: "ص 3", q: "تعرف عملية تبادل سلع مقابل سلع أخرى أو خدمات مقابل خدمات أخرى دون دخول أداة وسيطة موحدة بـ:", options: ["النقد بأمر الحكومة", "اقتصاد المبادلة أو المقايضة", "قاعدة الذهب الكاملة", "الائتمان المصرفي الآجل"], ans: 1, exp: "المقايضة (ص 3) هي تبادل سلع بسلع أو خدمات بخدمات أو أي توليفة بينهما دون وجود أداة وسيطة موحدة كالنقود." },
      { id: 3, page: "ص 3", q: "في اقتصاد المقايضة، كانت قدرة الفرد على اقتناء ما لدى الطرف الآخر تعتمد بشكل أساسي على:", options: ["حجم الودائع الجارية التي يمتلكها في البنك المركزي", "ما لديه من سلع وخدمات يقبل بها الطرف الآخر (توافق الرغبات)", "سعر صرف الذهب مقابل الفضة في الأسواق العالمية", "القرارات القانونية الصادرة عن السلطات النقدية"], ans: 1, exp: "قبل ابتكار النقود، كان حصول الفرد على سلعة مشروطاً بامتلاكه سلعة أو خدمة يرغب فيها الطرف الآخر، وهو ما يعرف بشرط توافق الرغبات (ص 3)." },
      { id: 4, page: "ص 3", q: "أي مما يلي يُعد من السلبيات المباشرة لاقتصاد المبادلة (المقايضة) المذكورة في المحاضرة؟", options: ["سهولة تجزئة جميع السلع والخدمات دون استثناء", "انعدام تكاليف التخزين تماماً", "احتمال عدم توافق الرغبات وصعوبة تجزئة السلع وتكاليف التخزين", "انخفاض عدد الأسعار النسبية للسلع في الأسواق"], ans: 2, exp: "حددت المحاضرة (ص 3) ست سلبيات للمقايضة: عدم توافق الرغبات، تلف السلع، تكاليف التخزين، الحاجة لمعلومات عن الأثمان، التنقل بين الأسواق، وصعوبة التجزئة." },
      { id: 5, page: "ص 3", q: "إن حاجة الأفراد في ظل اقتصاد المقايضة إلى التنقل المستمر بين الأسواق ترتب عليها بشكل مباشر:", options: ["زيادة التخصص وتقسيم العمل", "ضياع الوقت والجهد", "ارتفاع القيمة الحقيقية للنقود", "ظهور الحسابات الجارية والشيكات"], ans: 1, exp: "ذكرت المحاضرة (ص 3) أن الحاجة إلى التنقل بين الأسواق للبحث عن طرف متوافق في الرغبات يترتب عليها ضياع الوقت والجهد." },
      { id: 6, page: "ص 4", q: "تُعرف السلع التي استخدمها الإنسان قديماً كأدوات للتبادل (كالصوف والماشية والذهب) إلى جانب استخداماتها الاستهلاكية الأخرى بـ:", options: ["النقود السلعية", "النقد بأمر الحكومة", "النقود الإلكترونية", "الودائع تحت الطلب"], ans: 0, exp: "النقود السلعية (ص 4) هي سلع لها قيمة تبادلية كوسيط للتبادل إلى جانب قيمتها كسلعة استهلاكية (مثل الماشية والصوف والمحاصيل والذهب والفضة)." },
      { id: 7, page: "ص 4", q: "ماذا يطلق على النقود الورقية المستخدمة حالياً والتي لا يمكن تحويلها إلى أي شيء آخر وتكون قيمتها النقدية أكبر من قيمتها السوقية كسلعة؟", options: ["النقود السلعية المعدنية", "إيصالات الصاغة الذهبية", "النقد بأمر الحكومة (النقود الإلزامية)", "سبائك قاعدة الذهب"], ans: 2, exp: "النقد بأمر الحكومة (ص 4) هي النقود الورقية الحالية التي لا تتعهد الحكومة بتحويلها إلى ذهب أو غيره، وتكون قيمتها النقدية أكبر من قيمتها كسلعة ورقية." },
      { id: 8, page: "ص 4", q: "من أين يكتسب «النقد بأمر الحكومة» أهميته وقوته في التداول رغم عدم تعهد الحكومة بتحويله إلى ذهب؟", options: ["من القيمة السوقية للورق والحبر المستخدم في طباعته", "من قبول الناس له وثقتهم فيه كأداة للتبادل", "من وزنه المعدني الثابت", "من إمكانية إذابته واستخدامه في صناعة الزينة"], ans: 1, exp: "أكدت المحاضرة (ص 4) أن النقد بأمر الحكومة لا تتعهد الحكومة بتحويله إلى أي شيء، بل يكتسب أهميته من قبول الناس له." },
      { id: 9, page: "ص 4", q: "في ظل نظام (قاعدة الذهب)، كيف كان يتحدد سعر صرف العملات المختلفة بعضها مقابل بعض؟", options: ["بناءً على علاقة كل عملة بالذهب باعتباره العامل المشترك بينها", "عن طريق المزادات اليومية للنفط والمحاصيل الزراعية", "بناءً على حجم الحسابات الجارية في البنوك التجارية فقط", "بشكل عشوائي دون أي رابط مشترك"], ans: 0, exp: "في قاعدة الذهب (ص 4) يتم تحديد قيمة كل عملة مقابل كمية محددة من الذهب، وبذلك يصبح الذهب هو العامل المشترك الذي تتحدد على أساسه أسعار الصرف." },
      { id: 10, page: "ص 4", q: "أي من الآتي لا يُعد من خصائص (قواعد) قاعدة الذهب الثلاث المذكورة في المحاضرة؟", options: ["وجوب تحديد قيمة العملة المحلية بمقدار محدد من الذهب", "ضرورة مواكبة عرض النقود المحلي لكمية الذهب المتوفرة بالبلاد", "استعداد الحكومة لاستبدال العملة المحلية بذهب دون حدود أو قيود", "منع الأفراد نهائياً من تحويل العملة الورقية إلى ذهب تحت أي ظرف"], ans: 3, exp: "منع التحويل يتناقض تماماً مع الخاصية الثالثة لقاعدة الذهب (ص 4) التي تشترط استعداد الحكومة لاستبدال العملة المحلية بما يساويها من ذهب دون حدود أو قيود." },
      { id: 11, page: "ص 5", q: "عندما كان الذهب يستخدم لأغراض النقد ولأغراض الزينة معاً، فإن زيادة الطلب على الذهب من أجل الزينة كانت تؤدي إلى:", options: ["تناقص كمية الذهب المتوفرة لتوفير الغطاء التام لكمية النقد المصدر", "زيادة الغطاء الذهبي للعملة المصدرة في البنك المركزي تلقائياً", "اختفاء العملات الفضية من التداول فوراً", "انخفاض السعر العالمي لمعدن الذهب"], ans: 0, exp: "أوضحت الملاحظة في (ص 5) أن الكمية المعروضة من الذهب يجب أن تفي بطلبات القطاعين (النقد والزينة)، فزيادة الطلب للزينة يقلل الذهب المتاح كغطاء للنقد المصدر." },
      { id: 12, page: "ص 5", q: "ينص قانون جريشم (Gresham's Law) في الاقتصاد النقدي على أن:", options: ["النقود الجيدة تطرد النقود السيئة من التداول", "تفضيل الأفراد استخدام النقود السيئة يدفع النقود الجيدة خارج التداول", "عرض النقود يخلق الطلب المساوي له دائماً", "عدد معدلات التبادل يتناسب عكسياً مع عدد السلع"], ans: 1, exp: "ينص قانون جريشم (ص 5) على أن تفضيل الأفراد استخدام النقود السيئة يدفع النقود الجيدة خارج التداول حرصاً من الأفراد على الحفاظ على ثرواتهم." },
      { id: 13, page: "ص 5", q: "إذا وجدت عملتان معدنيتان بنفس القيمة الإسمية، الأولى محتواها الذهبي 100% من قيمتها الرسمية، والثانية 50% فقط، فوفقاً لقانون جريشم:", options: ["يحتفظ الجمهور بالعملة الأولى (الجيدة) ويستخدم العملة الثانية (السيئة) في التبادل", "يذيب الجمهور العملة الثانية ويترك العملة الأولى في التداول", "تختفي العملة الثانية من الأسواق وتبقى العملة الأولى فقط", "تتساوى القيمة السوقية للمعدن في كلتا العملتين"], ans: 0, exp: "حسب مثال قانون جريشم (ص 5)، يحتفظ الجمهور بالعملة ذات المحتوى الذهبي الكامل (أو يذيبها عند ارتفاع سعر الذهب) ويدفع بالعملة الأقل محتوى في التداول." },
      { id: 14, page: "ص 5", q: "كيف يظهر تطبيق قانون جريشم في الدول المعاصرة التي تتعرض عملتها المحلية لتناقص قيمتها بسبب التضخم؟", options: ["يتخلص الأفراد من النقد الأجنبي ويحتفظون بالنقد المحلي كمدخرات", "يحتفظ الأفراد بالنقد الأجنبي (نقود جيدة) ويستخدمون النقد المحلي (نقود سيئة) في التبادل للتخلص منه بسرعة", "يتوقف الأفراد عن شراء السلع والخدمات نهائياً", "ترتفع القيمة الحقيقية للعملة المحلية مقابل العملات الأجنبية"], ans: 1, exp: "في أوقات التضخم (ص 5)، تمثل العملة الأجنبية (النقود الجيدة) فيكتنزها الأفراد، بينما تمثل العملة المحلية المتدهورة (النقود السيئة) فيتخلصون منها بسرعة في المبادلات." },
      { id: 15, page: "ص 6", q: "يرجع استمرار الجدل حول تحديد مفهوم وتعريف واحد للنقود من وقت لآخر ومن دولة لأخرى إلى:", options: ["عدم أهمية النقود في النشاط الاقتصادي الحديث", "الطبيعة الديناميكية لمفهوم النقود واختلاف الاستعمالات وظروف النمو الاقتصادي", "ثبات مكونات النقود منذ عصر المقايضة وحتى اليوم", "اقتصار النقود على المسكوكات الذهبية فقط"], ans: 1, exp: "أشارت المحاضرة (ص 6) إلى أن الجدل يرجع لأهمية النقود في الاقتصاد وطبيعتها الديناميكية المتغيرة حسب الاستعمالات وظروف النمو الاقتصادي." },
      { id: 16, page: "ص 6", q: "المدخل الذي يعرف النقود بأنها «سندات بحجم ولون معين مع بعض الكلمات والرموز المطبوعة عليها وعملات معدنية من نوع معين» هو:", options: ["المدخل الوظيفي", "المدخل القانوني", "المدخل المادي", "المدخل الفني"], ans: 2, exp: "المدخل المادي (ص 6) يركز على الشكل المادي الظاهري للورقة النقدية والعملة المعدنية." },
      { id: 17, page: "ص 6", q: "ما هو الانتقاد الأساسي الموجه إلى (المدخل المادي) في تعريف النقود؟", options: ["أنه يحصر النقود في نطاق ضيق للغاية ويتجاهل أشكالها الأخرى كالأحجار والنقود الإلكترونية", "أنه يركز فقط على وظيفة المدفوعات الآجلة", "أنه يشترط موافقة الصاغة على إصدار النقود", "أنه يلغي دور العملات المعدنية من التداول"], ans: 0, exp: "يعاب على المدخل المادي (ص 6) حصره للنقود في نطاق ضيق جداً، لأن النقود اتخذت أشكالاً عديدة منذ الأحجار وحتى النقود الإلكترونية." },
      { id: 18, page: "ص 6", q: "أي مدخل يعرف النقود بأنها «أداة فنية اكتشفها الإنسان ليتخلص من خلالها من صعوبات المقايضة»؟", options: ["المدخل القانوني", "المدخل الفني", "المدخل المادي", "المدخل الوظيفي"], ans: 1, exp: "هذا هو نص تعريف المدخل الفني للنقود (ص 6)، ويعاب عليه أنه لا يظهر الأساس الذي ترتكز عليه النقود في مباشرة وظائفها." },
      { id: 19, page: "ص 6", q: "يرتكز (المدخل القانوني) في تعريفه للنقود على خاصية جوهرية هي:", options: ["اللون والحجم المطبوع على الورقة", "القدرة على إبراء الذمة والتمتع بالقبول العام للوفاء بالالتزامات", "كونها مصنوعة من معدن الذهب الخالص بنسبة 100%", "عدم خضوعها لأي تشريعات حكومية"], ans: 1, exp: "يعرف المدخل القانوني النقود (ص 6) بأنها الشيء الذي تتوافر فيه القدرة على إبراء الذمة وتتمتع بالقبول العام على الوفاء بالالتزامات داخل المجتمع." },
      { id: 20, page: "ص 7", q: "ما هو العيب الموجه إلى (المدخل القانوني) من وجهة نظر الاقتصاديين؟", options: ["أن الاقتصاديين لا يشترطون تمتع النقود بالقدرة القانونية على إبراء الذمة، بل يكفي القبول العام كوسيط للتبادل", "أن القانون يمنع تداول النقود الورقية في الأسواق", "أن المدخل القانوني يعجز عن تفسير سداد الديون الحكومية", "أنه يحصر النقود في البطاقات الذكية فقط"], ans: 0, exp: "أوضحت المحاضرة (ص 7) وجود اختلاف بين المنظور الاقتصادي والقانوني؛ فالاقتصاديون لا يشترطون القدرة القانونية على إبراء الذمة بل القبول العام كوسيط للتبادل." },
      { id: 21, page: "ص 7", q: "المدخل الذي يعرف النقود بأنها «أي شيء ذو قبول عام في التداول ويستخدم وسيطاً للتداول ومقياساً ومستودعاً للقيمة ووسيلة للمدفوعات الآجلة» هو:", options: ["المدخل المادي", "المدخل الفني", "المدخل الوظيفي", "مدخل المقايضة"], ans: 2, exp: "المدخل الوظيفي (ص 7) يستدل على تعريف النقود من خلال وظائفها الأربع الأساسية في الاقتصاد." },
      { id: 22, page: "ص 7", q: "تاريخياً، كيف ظهرت النقود الورقية في بدايتها بعد أن أصبح حمل الذهب يمثل عبئاً كبيراً مع زيادة حجم المعاملات؟", options: ["عن طريق إيصالات وشهادات أصدرها الصاغة مقابل الودائع الذهبية للأفراد", "عن طريق طبع العملات البلاستيكية في البنوك الإلكترونية", "بواسطة مقايضة المحاصيل الزراعية بالماشية", "عن طريق إلغاء التجارة الخارجية بين الدول"], ans: 0, exp: "ظهرت النقود الورقية على أيدي الصاغة (ص 7) الذين قبلوا الودائع الذهبية مقابل إيصالات أو شهادات، ثم تم تداول هذه الإيصالات بدلاً من الذهب." },
      { id: 23, page: "ص 7", q: "ما هي دلالة استخدام عبارة «أي شيء» في صدر تعريف المدخل الوظيفي للنقود؟", options: ["الدلالة على ضعف قيمة النقود في العصر الحديث", "الدلالة على الأهمية والشمولية والعدد غير المحدود من الأشياء التي استخدمت كنقود عبر التاريخ", "الدلالة على أن النقود لا تحتاج إلى قبول عام", "حصر النقود في المعادن النفيسة فقط"], ans: 1, exp: "ذكرت المحاضرة (ص 7) أن كلمة (أي شيء) لها من الأهمية والشمولية الكثير، حيث تدل على العدد غير المحدود من الأشياء التي استخدمت كنقود." },
      { id: 24, page: "ص 7", q: "ما هو الوضع القانوني للحسابات الجارية في البنوك التجارية المتداولة عبر الشيكات حسب ما ورد في المحاضرة؟", options: ["لها الوضع القانوني الكامل كعملة قانونية إلزامية لا يمكن رفضها", "ليس لها الوضع القانوني كعملة قانونية، ولكن البنوك ملزمة بتحويلها إلى عملة قانونية عند طلب المودعين", "تعتبر نقوداً سلعية ذهبية", "لا تدخل ضمن مفهوم النقود الوظيفي مطلقاً"], ans: 1, exp: "نصت المحاضرة (ص 7 و 8) على أنه بالرغم من الحسابات الجارية بالبنوك التجارية ليس لها الوضع القانوني كعملة قانونية، إلا أن البنوك ملزمة بتحويلها لعملة قانونية عند الطلب." },
      { id: 25, page: "ص 8", q: "إن الهدف الرئيسي لصانعي السياسة الاقتصادية من تعريف وقياس حجم النقود المتداولة في المجتمع هو:", options: ["إلغاء البنوك التجارية والعودة لنظام الصاغة", "السيطرة والرقابة على حجم النقود لتحقيق استقرار المستوى العام للأسعار وزيادة النشاط الاقتصادي", "زيادة معدلات التضخم السنوية بشكل مستمر", "منع استخدام النقود كوحدة قياس للأثمان"], ans: 1, exp: "أكدت المحاضرة (ص 8) أن الهدف من تعريف وقياس حجم النقود هو تمكين صانعي السياسة الاقتصادية من الرقابة على حجم النقود لتحقيق استقرار الأسعار وزيادة النشاط الاقتصادي." },
      { id: 26, page: "ص 8", q: "ساهمت وظيفة النقود كـ (أداة للتبادل) في معالجة عيوب المقايضة من خلال:", options: ["توفير الوقت للتخصص في الإنتاج واستقلال عمليات البيع عن عمليات الشراء", "دمج عملية البيع والشراء في لحظة زمنية واحدة إجبارياً", "زيادة عدد القيم التبادلية في السوق إلى أضعاف مضاعفة", "إجبار الأفراد على القيام بأعمال إنتاجية لا يتقنونها"], ans: 0, exp: "أوضحت المحاضرة (ص 8) أن وظيفة التبادل وفرت الوقت للتخصص في الإنتاج وأدت إلى استقلال عمليات البيع عن عمليات الشراء." },
      { id: 27, page: "ص 8", q: "في اقتصاد المقايضة، إذا كان لدينا 10 سلع في السوق، فكم عدد معدلات التبادل (القيم التبادلية) وفق القانون [ ن(ن-1) ÷ 2 ]؟", options: ["10 قيم تبادلية", "20 قيمة تبادلية", "45 قيمة تبادلية", "90 قيمة تبادلية"], ans: 2, exp: "بتطبيق المعادلة (ص 8 و 9): 10 × (10 - 1) ÷ 2 = (10 × 9) ÷ 2 = 45 قيمة تبادلية." },
      { id: 28, page: "ص 8", q: "تطبيقاً لمعادلة معدلات التبادل في المحاضرة، إذا زاد عدد السلع في اقتصاد مقايضة إلى 20 سلعة، فكم سيبلغ عدد معدلات التبادل؟", options: ["20 معدل تبادل", "100 معدل تبادل", "190 معدل تبادل", "380 معدل تبادل"], ans: 2, exp: "بتطبيق القانون: [ 20 × (20 - 1) ] ÷ 2 = (20 × 19) ÷ 2 = 190 معدل تبادل، بينما في اقتصاد النقود ستكون 20 سعراً نقدياً فقط." },
      { id: 29, page: "ص 9", q: "عند الانتقال من اقتصاد المقايضة إلى اقتصاد النقود في سوق يضم 10 سلع، يتقلص عدد الأسعار من 45 قيمة تبادلية إلى:", options: ["سعر واحد فقط لجميع السلع", "5 أسعار نقدية", "10 أسعار نقدية (حيث يوضع سعر نقدي لكل سلعة)", "25 سعراً نقدياً"], ans: 2, exp: "ذكرت المحاضرة (ص 9) أن استخدام النقود يقلص عدد الأسعار لـ 10 سلع من 45 قيمة تبادلية إلى 10 أسعار فقط، وترد قيم جميع السلع لوحدة قياس واحدة." },
      { id: 30, page: "ص 9", q: "تتوقف فاعلية النقود كـ (مخزن أو مستودع للقيمة) بشكل مباشر على:", options: ["فاعليتها كمقياس للقيمة واحتفاظها بقوتها الشرائية نتيجة الثبات النسبي للعرض والطلب على النقود", "سرعة تلفها المادي وارتفاع تكاليف تخزينها", "انخفاض قيمتها الحقيقية بشكل يومي", "عدم وجود أي فاصل زمني بين البيع والشراء"], ans: 0, exp: "نصت المحاضرة (ص 9) على أن فاعلية النقود كمخزن للقيمة تتوقف على فاعليتها كمقياس للقيمة واحتفاظها بقوتها الشرائية لفترة طويلة عبر استقرار مستوى الأسعار." },
      { id: 31, page: "ص 9", q: "ماذا يحدث للقيمة الحقيقية (القوة الشرائية) للنقود في فترات الانكماش وفي فترات التضخم على التوالي؟", options: ["ترتفع في فترات الانكماش، وتنخفض في فترات التضخم", "تنخفض في فترات الانكماش، وترتفع في فترات التضخم", "تبقى ثابتة تماماً في كلتا الفترتين", "تنعدم في الانكماش وتتضاعف في التضخم"], ans: 0, exp: "العلاقة عكسية بين المستوى العام للأسعار والقيمة الحقيقية للنقود (ص 9): فترتفع القيمة الحقيقية للنقود في فترات الانكماش (تدهور الأسعار) وتنخفض في فترات التضخم." },
      { id: 32, page: "ص 9", q: "لماذا يلجأ الأفراد في فترات التضخم واستمرار ارتفاع الأسعار إلى الاحتفاظ بالقيمة في صورة (أصول حقيقية) بدلاً من النقود؟", options: ["لأنها تدر عائداً (ربح، فائدة، ريع) وتحقق أرباحاً رأسمالية مع ارتفاع الأسعار", "لأن الأصول الحقيقية لا يمكن أن تتعرض لأي خسائر رأسمالية عند تسييلها", "لأن القوة الشرائية للنقود ترتفع بشدة أثناء التضخم", "لأن القانون يمنع حيازة النقود الورقية أثناء التضخم"], ans: 0, exp: "أوضحت المحاضرة (ص 9) أن الأصول الحقيقية تدر عائداً (ربح، فائدة، أو ريع) وتحقق أرباحاً رأسمالية عند ارتفاع الأسعار، رغم احتمال تعرضها لخسائر رأسمالية عند الحاجة لتحويلها لنقد." },
      { id: 33, page: "ص 10", q: "ما هو السبب الاقتصادي الذي أدى إلى ضرورة تسويق المنتجات على أساس العقود وظهور وظيفة النقود كـ (معيار للمدفوعات الآجلة)؟", options: ["زيادة حجم الإنتاج الجاري عن قيمة المبيعات الجارية وتزايد المخزون السلعي في المجتمعات الحديثة", "توقف المصانع عن الإنتاج وانعدام المخزون السلعي", "الرغبة في العودة إلى نظام المقايضة المباشرة", "إلغاء الفوائد المصرفية وعقود الائتمان"], ans: 0, exp: "أشارت المحاضرة (ص 10) إلى أن زيادة الإنتاج الجاري عن المبيعات الجارية وتزايد المخزون السلعي فرض تسويق المنتجات على أساس العقود لتجنب تكديس المخزون." },
      { id: 34, page: "ص 10", q: "لكي تقوم النقود بوظيفتها كمعيار للمدفوعات الآجلة بكفاءة دون التسبب في اضطراب سوق الائتمان، يجب عليها:", options: ["الاحتفاظ بقيمتها لفترة طويلة نسبياً دون تذبذب ملموس", "تغيير قيمتها الإسمية والحقيقية كل أسبوع", "الاقتصار على قياس القيم الحاضرة فقط دون الآجلة", "تخفيض حجم الائتمان والنشاط الاقتصادي"], ans: 0, exp: "أكدت المحاضرة (ص 10) أنه لكي تقوم النقود بوظيفة وسيط المدفوعات الآجلة وجب عليها الاحتفاظ بقيمتها لفترة طويلة نسبياً لأن التذبذب يربك سوق الائتمان." },
      { id: 35, page: "ص 10", q: "في فترات ارتفاع الأسعار (التضخم) وتدهور قيمة النقود، ما هو الأثر المترتب على العلاقة بين الدائن (المقرض) والمدين (المقترض)؟", options: ["إعادة توزيع الثروة من الدائن إلى المدين (يتضرر الدائن ويستفيد المدين)", "إعادة توزيع الدخل من المدين إلى الدائن (يتضرر المدين ويستفيد الدائن)", "حصول الدائن على قوة شرائية أكبر مما أقرضه عند عقد القرض", "عدم تأثر أي من الطرفين بالتغير في الأسعار"], ans: 0, exp: "في فترات ارتفاع الأسعار (ص 10) يجد الدائن أن قيمة السلع التي يشتريها القرض عند رده أقل من وقت التعاقد، مما ينطوي على إعادة توزيع الثروة من الدائن إلى المدين." },
      { id: 36, page: "ص 10", q: "في فترات انخفاض الأسعار (الانكماش)، ماذا يحدث عند سداد القروض الآجلة؟", options: ["تزيد القوة الشرائية للقرض عند رده عما كانت عليه وقت التعاقد، فيعاد توزيع الدخل من المدين إلى الدائن", "تنخفض القوة الشرائية للقرض عند رده، فيستفيد المدين", "يسقط القرض قانونياً ولا يلتزم المدين بالسداد", "تنخفض القيمة الحقيقية للنقود"], ans: 0, exp: "في فترات انخفاض الأسعار (ص 10) يجد المدين أن القرض عند رده يشتري سلعاً أكثر من وقت التعاقد، مما يتضمن إعادة توزيع الدخل من المدين إلى الدائن." },

      // --- الجديد المفصل (ص 11 إلى ص 19) ---
      { id: 37, page: "ص 11-12", q: "لكي تحافظ النقود على ثقة وإقبال الجماهير عليها، يجب أن تتميز بصفة (الندرة أو محدودية الكمية المعروضة)، وذلك بهدف:", options: ["التوفيق بين الكمية المعروضة والكمية المطلوبة لتجنب ارتفاع الأسعار وانهيار قيمتها", "تشجيع الأفراد على العودة إلى نظام المقايضة", "زيادة تكاليف تخزين السلع", "تسهيل حمل النقود ونقلها"], ans: 0, exp: "أكدت المحاضرة (ص 11) أن زيادة كمية النقد بشكل لا يواكب قدرات الاقتصاد الإنتاجية يساهم في ارتفاع الأسعار وانهيار قيمة النقود، لذا وجب محدودية المعروض منها." },
      { id: 38, page: "ص 11-12", q: "ما هو الهدف الأساسي من وراء توجيه الحكومات لموارد مالية وتشكيل إدارات أمنية لجعل النقود (صعبة التزوير أو التقليد)؟", options: ["التقليل من القوة الشرائية للنقود", "التضييق على محاولات التزييف لتعزيز مصداقية النقود وثقة الجمهور وقبولهم لها", "إجبار الناس على استخدام المعادن النفيسة فقط", "زيادة السيولة في السوق"], ans: 1, exp: "ذكرت المحاضرة (ص 11) أن الوقاية من التزييف تعزز ثقة الجمهور بالنقود وتجعلهم يدركون أنها سليمة ولن ترفض." },
      { id: 39, page: "ص 11-12", q: "تتميز النقود بخاصية (سهولة الاحتفاظ بها)، كيف تختلف هذه الخاصية عن الاحتفاظ بالسلع في اقتصاد المقايضة؟", options: ["المقايضة تتطلب مخزوناً ضخماً من السلع، بينما النقود تتطلب احتفاظاً بنقد محدود يؤدي نفس المهام", "النقود تحتاج إلى مساحات تخزين أكبر من السلع", "المقايضة لا تحتاج لأي مكان للاحتفاظ بالسلع", "النقود تتعرض للتلف أسرع من المحاصيل الزراعية"], ans: 0, exp: "ذكرت المحاضرة (ص 12) أن المقايضة تتطلب مخزوناً من السلع، أما النقود فكل ما هو مطلوب الاحتفاظ بنقد محدود يؤدي مهام كمية كبيرة من السلع." },
      { id: 40, page: "ص 11-12", q: "لماذا تعتبر خاصية (سهولة حملها ونقلها) ضرورية جداً للنقود؟", options: ["لأنها تمنع التضخم", "لأن صعوبة نقلها سيصعب استخدامها على نطاق واسع في التنقل بين الأسواق", "لأنها تزيد من القوة الشرائية للمواطن", "لتقليل الاعتماد على البنوك المركزية"], ans: 1, exp: "أوضحت المحاضرة (ص 12) أنه بدلاً من نقل سلع ثقيلة بين الأسواق، ينتقل المرء بنقود في محفظته، وإن لم تتوفر هذه الخاصية سيصعب استخدامها على نطاق واسع." },
      { id: 41, page: "ص 11-12", q: "خاصية (قوة التحمل) في النقود تعني:", options: ["أنها تستطيع شراء سلع بأسعار مرتفعة", "أنها مصنوعة من مواد غير قابلة للهلاك والتلف بسرعة", "أنها تتحمل الضرائب الحكومية", "أن البنوك قادرة على تخزينها لفترات قصيرة فقط"], ans: 1, exp: "نصت المحاضرة (ص 12) على أن قوة التحمل تعود إلى عدم قابلية النقود للهلاك بسرعة، وتتعلق بطبيعة المواد التي تصنع منها." },
      { id: 42, page: "ص 11-12", q: "إن توفر فئات نقدية مختلفة القيم وقابلة للتجزئة إلى وحدات صغيرة متساوية القيمة يسمح بـ:", options: ["توسيع وتسهيل عملية التبادل في المعاملات الصغيرة", "زيادة احتمالية تلف النقود", "تحويل النقود إلى أصول حقيقية", "إلغاء دور الحكومة في إصدار النقود"], ans: 0, exp: "أوضحت المحاضرة (ص 12) أنه كلما أمكن تجزئة النقود لوحدات صغيرة كلما أمكن توسيع عملية التبادل في المعاملات الصغيرة." },
      { id: 43, page: "ص 11-12", q: "الخاصية التي أغنت الأفراد عن عملية الفحص المتكرر لوزن ونقاوة الأداة الوسيطة (كما كان يحدث مع المعادن كالذهب والفضة) هي:", options: ["سهولة الحمل والنقل", "قوة التحمل", "وحدة أشكالها وسهولة تمييزها والتعرف عليها (التجانس)", "محدودية الكمية المعروضة"], ans: 2, exp: "خاصية (وحدة الأشكال وسهولة التمييز) جعلت الأوراق النقدية متطابقة ضمن الفئة الواحدة، مما أغنى عن فحصها أو الاستعانة بمختص للتأكد من نقاوتها عكس المعادن (ص 12 و 13)." },
      { id: 44, page: "ص 11-12", q: "لماذا تكتسب النقود ثقة الجمهور لكون (الحكومة هي المصدرة لها)؟", options: ["لأن الحكومة تمنح فوائد على النقود الورقية", "بسبب تضاؤل احتمال عجز الحكومة عن الإيفاء بالتزاماتها مقارنة بأي جهة أخرى", "لأن الحكومة تجبر الناس على شراء الأصول الحقيقية", "لأن الحكومة تستبدل النقود الورقية بالذهب فوراً"], ans: 1, exp: "ذكرت المحاضرة (ص 13) أن ثقة الجمهور بالحكومة تكمن في تضاؤل احتمال عجزها عن الإيفاء بالتزاماتها مقارنة بالجهات الأخرى." },
      { id: 45, page: "ص 13-14", q: "في التحليل الاقتصادي، تتكون (الثروة الحقيقية للمجتمع) ككل من:", options: ["الأصول النقدية والمالية فقط", "الأصول الحقيقية (السلع المادية الملموسة) فقط", "الأصول الحقيقية والأصول النقدية معاً", "الودائع تحت الطلب فقط"], ans: 1, exp: "أشارت المحاضرة (ص 13) إلى أن ثروة المجتمع تتكون من الأصول الحقيقية فقط، أما الأصول النقدية فهي تمثل ثروة للأفراد، ولا تحسب ضمن ثروة المجتمع لمنع الازدواج المبالغ فيه." },
      { id: 46, page: "ص 13-14", q: "إذا حدث انخفاض حاد في أسعار الأسهم في البورصة أو تغير في قيمة النقود، فما هو الأثر المباشر لذلك على المجتمع؟", options: ["انخفاض مجموع الثروة القومية الحقيقية للمجتمع فوراً", "انهيار الأصول الحقيقية (كالعقارات والمصانع)", "تغيير في توزيع ثروة المجتمع بين الأفراد دون تخفيض مجموع الثروة الحقيقية مباشرة", "لا يحدث أي أثر مالي إطلاقاً"], ans: 2, exp: "ذكرت المحاضرة (ص 13) أن الأثر المباشر والفوري للتغير في قيمة الحقوق (كالأسهم والنقود) لا يكون على مجموع الثروة القومية وإنما يكون الأثر على توزيع هذه الثروة." },
      { id: 47, page: "ص 13-14", q: "تُعرّف (السيولة) في الاصطلاح المالي بأنها:", options: ["قدرة الحكومة على طبع المزيد من العملات الورقية", "سرعة تسويق أو تسييل الأصل للحصول على سلع وخدمات فورية دون تحمل خسارة", "شراء العقارات والأراضي في فترات التضخم", "إلغاء الودائع الآجلة من البنوك"], ans: 1, exp: "السيولة (ص 14) ترمز لسرعة تسويق الأصل، ودرجة السيولة هي القدرة على استبدال الأصل بالنقود بأسرع وقت ممكن ودون تحمل خسارة." },
      { id: 48, page: "ص 13-14", q: "عندما يختار الفرد الاحتفاظ بثروته في شكل (نقود سائلة) بدلاً من الأسهم أو السندات، فإنه يتحمل تضحية اقتصادية تتمثل في:", options: ["التضحية بالسيولة الفورية", "التضحية بتيار من الدخل (فائدة أو ربح) كان سيحصل عليه لو احتفظ بأصول أخرى", "التضحية بالقبول العام للنقود", "تحمل تكاليف تخزين باهظة"], ans: 1, exp: "أوضحت المحاضرة (ص 14) أن النقود بذاتها لا تدر دخلاً، فالاحتفاظ بها ينطوي على تضحية بتيار من الدخل (فائدة أو ربح) مقارنة بحيازة الأسهم أو السندات." },
      { id: 49, page: "ص 13-14", q: "ما هي طبيعة العلاقة بين (سيولة الأصل) و (العائد الذي يدره)؟", options: ["علاقة طردية", "علاقة عكسية (كلما زادت السيولة قل العائد والعكس صحيح)", "لا توجد علاقة بينهما", "علاقة متساوية دائماً"], ans: 1, exp: "أشارت المحاضرة (ص 14) بوضوح إلى وجود علاقة عكسية بين سيولة الأصل والعائد (النقود سيولتها 100% ولكن لا تدر عائداً، بينما العقارات تدر عائداً ولكن سيولتها منخفضة)." },
      { id: 50, page: "ص 15-16", q: "وفقاً للتحليل النقدي، ما هي المكونات التي يطلق عليها مصطلح (وسائل الدفع) والتي تؤثر تأثيراً مباشراً على النشاط الاقتصادي؟", options: ["الودائع الآجلة والودائع الادخارية", "صافي العملة المتداولة خارج البنوك + الودائع الجارية الخاصة", "الأسهم والسندات الحكومية", "الودائع الحكومية فقط"], ans: 1, exp: "حددت المحاضرة (ص 15) أن وسائل الدفع تتضمن: صافي العملة المتداولة خارج البنوك (النقد + العملة المساعدة) + الودائع الجارية الخاصة." },
      { id: 51, page: "ص 15-16", q: "ماذا يطلق على الأصول مثل (الودائع الآجلة في البنوك وغيرها من المدخرات النقدية) والتي يمكن أن تتحول بسهولة إلى نقود؟", options: ["النقود السلعية", "الأصول الحقيقية", "أشباه النقود (Near Money)", "المسكوكات الذهبية"], ans: 2, exp: "ذكرت المحاضرة (ص 15) أن أشباه النقود تتضمن الودائع الآجلة وغيرها من المدخرات، وتسمى كذلك لأن بإمكانها التحول لنقود بسبب درجة سيولتها العالية." },
      { id: 52, page: "ص 15-16", q: "العوامل المؤثرة على وسائل الدفع تشمل بنوداً في جانب الخصوم، منها:", options: ["رأس المال والاحتياطيات فقط", "الودائع لأجل التوفير لدى البنوك والودائع الحكومية", "الأصول الأجنبية للبنك المركزي", "القروض والسلفيات للقطاع الخاص"], ans: 1, exp: "حسب التقسيم في المحاضرة (ص 15)، الخصوم المؤثرة تتضمن: الودائع لأجل التوفير، الودائع الحكومية، وحسابات المقاصة وغيرها." },
      { id: 53, page: "ص 15-16", q: "مفهوم المعاملات لقياس العرض النقدي (M1 - التعريف الضيق) يركز بشكل أساسي على أي وظيفة من وظائف النقود؟", options: ["النقود كمستودع للقيمة", "النقود كأداة أو وسيط للتبادل", "النقود كمعيار للمدفوعات الآجلة", "النقود كوحدة لقياس الأثمان"], ans: 1, exp: "يقوم مفهوم المعاملات M1 (ص 16) على أساس استخدام النقود كوسيلة للمدفوعات، ويركز على الأصول التي تستخدم (كوسيط للتبادل)." },
      { id: 54, page: "ص 15-16", q: "لماذا يتم (استبعاد الودائع لدى البنوك التجارية التي يحتفظ بها البنك المركزي كاحتياطي) عند حساب العرض النقدي M1؟", options: ["لأنها لا تحمل قيمة قانونية", "لأن احتسابها كنقود متداولة سيترتب عليه الازدواج في حساب النقود", "لأن البنوك التجارية ترفض تداولها", "لأنها تعتبر أصولاً أجنبية"], ans: 1, exp: "نصت المحاضرة (ص 16) على أن الودائع لدى البنوك أو النقدية كاحتياطي بالبنك المركزي تستبعد لأن احتسابها سيترتب عليه ازدواج في حساب النقود." },
      { id: 55, page: "ص 15-16", q: "وفقاً لمفهوم (M1)، لماذا يتم استبعاد (الودائع الحكومية) من حساب العرض النقدي الضيق؟", options: ["لأن الحكومة ترفض استخدامها", "لأنها لا تمثل وسائل دفع مباشرة لشراء السلع والخدمات في المجتمع حالياً", "لأنها أرباح رأسمالية", "لأنها تابعة لصندوق النقد الدولي"], ans: 1, exp: "أوضحت المحاضرة (ص 17) أنه يستبعد من الودائع تحت الطلب (الودائع الحكومية) وذلك لأنها لا تمثل وسائل دفع لشراء السلع والخدمات في المجتمع ضمن المفهوم الضيق." },
      { id: 56, page: "ص 15-16", q: "ما هي العلاقة المتوقعة بين العرض النقدي (M1) والنشاط الاقتصادي في ظل ثبات ظروف الطلب على السلع؟", options: ["زيادة العرض النقدي تؤدي إلى توقف الإنتاج تماماً", "زيادة العرض النقدي تؤدي إلى زيادة الطلب على عناصر الإنتاج مما يرفع الإنتاج والعمالة", "لا توجد أي علاقة بين M1 والنشاط الاقتصادي", "نقص العرض النقدي يزيد من أرباح المنتجين"], ans: 1, exp: "يرى أنصار M1 (ص 17) أن زيادة العرض النقدي مع ثبات الطلب الاستهلاكي تزيد الطلب على عناصر الإنتاج مما شأنه زيادة الإنتاج والعمالة." },
      { id: 57, page: "ص 17-19", q: "على ماذا يرتكز (مفهوم السيولة M2) في قياس العرض النقدي ولماذا يشمل الودائع الادخارية والآجلة؟", options: ["يرتكز على وظيفة النقود كـ(مستودع للقيمة) لأن هذه الودائع عالية السيولة ويعتبرها المجتمع معادلة عملياً لعرض النقود", "يرتكز على وظيفة (وحدة قياس الأثمان) فقط", "يرتكز على استبعاد البنوك التجارية من الاقتصاد", "يرتكز على احتساب العقارات والأسهم كنقود سائلة"], ans: 0, exp: "مفهوم السيولة M2 (ص 17) يتحدد بناءً على وظيفة النقود (كمستودع للقيمة)، ويشمل الأصول عالية السيولة (أشباه النقود) لأنها قابلة للتحول بسهولة وتخضع لإدارة السياسة النقدية." },
      { id: 58, page: "ص 17-19", q: "أحد مبررات أنصار المفهوم (M2) هو أن تعريف النقود يجب أن لا يقتصر على الحسابات الجارية فقط، بل يجب أن يمتد ليشمل:", options: ["الذهب والفضة والماس", "الأصول المالية عالية السيولة لضمان تحقيق السيطرة والرقابة على عرض النقود واستقرار النشاط الاقتصادي", "العقارات التجارية والمصانع", "العملات المعدنية الأجنبية فقط"], ans: 1, exp: "برر أنصار M2 (ص 18) ذلك بأن الدافع من القياس هو الرقابة على العرض النقدي، لذا يجب أن يشمل الأصول المالية عالية السيولة التي تخضع للسياسة النقدية." },
      { id: 59, page: "ص 17-19", q: "يتكون العرض النقدي (M2) من:", options: ["M1 + الودائع الجارية فقط", "M1 + الودائع الآجلة وبإخطار، الودائع بصناديق التوفير، وشهادات الإيداع ذات الدخل الثابت بالبنوك التجارية", "M1 + الودائع الحكومية فقط", "M1 + بوالص التأمين"], ans: 1, exp: "حدد المقياس M2 (ص 18) بأنه يشمل: M1 + الودائع الآجلة/بإخطار + الودائع بصناديق التوفير + شهادات الإيداع بالبنوك التجارية." },
      { id: 60, page: "ص 17-19", q: "القصور الرئيسي في المقياس (M2) والذي دفع الاقتصاديين لاستخدام المقياس الأوسع (M3) هو:", options: ["أن M2 يشمل الذهب ولا يشمل الفضة", "أن M2 لا يتضمن الودائع الحكومية ولا الودائع الادخارية في المؤسسات المالية غير البنوك التجارية", "أن M2 يتجاهل النقد الورقي المتداول", "أن M2 يعتبر العقارات من وسائل الدفع"], ans: 1, exp: "أوضحت المحاضرة (ص 18) أن M2 لا يتضمن الودائع في المؤسسات غير البنوك التجارية ولا الودائع الحكومية، مما لا يعكس القياس الفعلي للسيولة، فظهر M3." },
      { id: 61, page: "ص 17-19", q: "لماذا يصر الاقتصاديون على إدخال (الودائع الحكومية) في المقياس الواسع (M3) رغم استبعادها من M1 و M2؟", options: ["لأن الحكومة تمنع البنوك من استخدامها", "لأن هذه الودائع سوف تنصب آجلاً أو عاجلاً في دائرة الإنفاق العام وتتحول إلى وسائل دفع في يد الأفراد", "لأنها تدفع فوائد أعلى من الودائع الخاصة", "لأنها أصول أجنبية غير قابلة للتحويل"], ans: 1, exp: "أكدت المحاضرة (ص 18-19) أن الودائع الحكومية ستنصب في دائرة الإنفاق العام وتتحول لوسائل دفع، مما يتطلب حسابها في العرض النقدي الواسع." },
      { id: 62, page: "ص 17-19", q: "يُعرف المقياس (M3) رسمياً في الاقتصاد بمصطلح:", options: ["إجمالي الاحتياطي الأجنبي", "إجمالي السيولة المحلية", "صافي العملة المتداولة", "رأس المال الثابت"], ans: 1, exp: "ذكرت المحاضرة (ص 19) أن M3 يحدد العرض النقدي بصورته الرسمية ويعرف بمصطلح (إجمالي السيولة المحلية)." },
      { id: 63, page: "ص 17-19", q: "أياً من الأصول التالية (لا ينتمي) إلى المكونات الإضافية في المقياس (M3)؟", options: ["الودائع الحكومية لدى البنوك التجارية", "الودائع الادخارية لدى المؤسسات المالية غير البنوك", "بوالص التأمين لدى شركات التأمين", "المصانع والمعدات الإنتاجية (الأصول الحقيقية)"], ans: 3, exp: "المصانع أصول حقيقية لا تدخل في أي مقياس نقدي. بينما M3 يشمل الودائع الحكومية، ودائع المؤسسات غير البنكية، وبوالص التأمين (ص 19)." },
      { id: 64, page: "ص 17-19", q: "إذا أراد البنك المركزي مراقبة (أقصى وأوسع مدى للسيولة النقدية والمالية) المتاحة في المجتمع، فأي مقياس سيستخدم؟", options: ["M1 فقط", "M2 فقط", "M3 (إجمالي السيولة المحلية)", "أصول البنوك الأجنبية فقط"], ans: 2, exp: "المقياس M3 (ص 19) هو التعريف الأوسع الذي يتضمن كل مكونات 1 و 2 بالإضافة للأصول المالية الأخرى ذات السيولة العالية نسبياً." },
      { id: 65, page: "ص 11-12", q: "صعوبة تعرف الأفراد على وحدات نقدية معينة (افتقار النقود لخاصية وحدة الأشكال) تؤدي بالضرورة إلى:", options: ["زيادة الثقة بالنقود", "رفض التعامل بها مما يعيق عملية التبادل وعدم اتساع استخدامها", "ارتفاع قيمتها عالمياً", "سهولة تجزئتها"], ans: 1, exp: "نصت المحاضرة (ص 12) على أن صعوبة التعرف على الوحدات يؤدي إلى رفض التعامل بها مما يعيق عملية التبادل." }
    ];

    const essayData = [
      { cat: "exam", tag: "نموذج B - س1 وص 4", q: "س1/ املأ الفراغات: تتميز النقود السلعية بـ .................... و ....................", ans: "<p>تتميز النقود السلعية بأن لها قيمتين:</p><ul><li><span class='key-highlight'>1. قيمة تبادلية (نقدية):</span> تستخدم كأداة للتبادل.</li><li><span class='key-highlight'>2. قيمة استعمالية (سلعية):</span> تستخدم لأغراض استهلاكية (كالزينة أو الغذاء).</li></ul>" },
      { cat: "exam", tag: "نموذج B - س1 وص 6, 8", q: "س2/ املأ الفراغ: ترجع أهمية تعريف النقود بالمعنى الواسع من أنه يتماشى مع ....................", ans: "<p>يتماشى مع <span class='key-highlight'>الطبيعة الديناميكية المتطورة لمفهوم النقود</span>، وكذلك <span class='key-highlight'>تمكين صانعي السياسة الاقتصادية من السيطرة والرقابة على حجم النقود المتداولة</span> لتحقيق الاستقرار.</p>" },
      { cat: "exam", tag: "نموذج B - س2 وص 8, 9", q: "س3/ ماذا يقصد بالوظائف التسهيلية للنقود؟ ولماذا هي أفضل مخزن للقيم؟", ans: "<p><span class='key-highlight'>الوظائف التسهيلية:</span> هي الوظائف الأساسية التي تسهل النشاط الاقتصادي (وسيط، مقياس، مخزن، معيار للدفع الآجل).</p><p><span class='key-highlight'>أسباب كونها أفضل مخزن للقيم:</span></p><ul><li>القبول العام والسيولة التامة.</li><li>عدم تعرضها لمخاطر التلف المادي وتناقص القيمة كالسلع.</li><li>إعفاء الفرد من تكاليف التخزين.</li><li>تجنب الخسائر الرأسمالية عند الحاجة للتسييل.</li></ul>" },
      { cat: "exam", tag: "نموذج B - س4 وص 3, 8", q: "س4/ ما هي الأسباب التي دفعت لظهور وظيفة النقود كوسيط للتبادل؟", ans: "<p>للتخلص من صعوبات اقتصاد المقايضة الستة (ص 3):</p><ul><li>القضاء على احتمال عدم توافق الرغبات.</li><li>تجنب تلف السلع وتكاليف تخزينها.</li><li>توفير الوقت والجهد في الأسواق.</li><li>التغلب على صعوبة تجزئة بعض السلع.</li><li>تحقيق استقلال البيع عن الشراء والتخصص في الإنتاج.</li></ul>" },
      { cat: "exam", tag: "نموذج A30 - س1 وص 4", q: "س5/ بمَ يتميز نظام قاعدة الذهب؟ وما هي قواعده؟", ans: "<p><span class='key-highlight'>ميزة النظام:</span> قبول الحكومات استبدال عملاتها بذهب وتحديد قيمتها به، ليصبح الذهب عامل الاستقرار.</p><p><span class='key-highlight'>قواعد قاعدة الذهب (ص 4):</span></p><ul><li>1. وجوب تحديد قيمة العملة بمقدار محدد من الذهب.</li><li>2. مواكبة عرض النقود لكمية الذهب المتوفرة كغطاء.</li><li>3. استعداد الحكومة لاستبدال العملة بالذهب دون قيود.</li></ul>" },
      { cat: "exam", tag: "نموذج A30 - س2 وص 9, 10", q: "س6/ كيف تؤثر التغيرات في الأسعار على القوة الشرائية للنقود؟", ans: "<p>العلاقة <span class='key-highlight'>عكسية</span> بين الأسعار والقوة الشرائية (ص 9 - 10):</p><ul><li><span class='key-highlight'>في التضخم (ارتفاع الأسعار):</span> تنخفض القوة الشرائية للنقود، ويلجأ الأفراد للأصول الحقيقية، ويعاد توزيع الثروة من الدائن للمدين.</li><li><span class='key-highlight'>في الانكماش (انخفاض الأسعار):</span> ترتفع القوة الشرائية للنقود، ويعاد توزيع الدخل من المدين للدائن.</li></ul>" },
      { cat: "exam", tag: "نموذج B30 - س2 وص 5", q: "س7/ املأ الفراغ: يرجع فشل نظام المعدنين (الذهب والفضة) إلى ....................", ans: "<p>يرجع إلى <span class='key-highlight'>فعل قانون جريشم - أن النقود السيئة تطرد النقود الجيدة من التداول (ص 5)</span>.</p><p>عند اختلاف القيمة السوقية للمعدن عن قيمته الرسمية، يكتنز الناس العملة الجيدة ويدفعون بالسيئة في التداول.</p>" },
      
      { cat: "lecture", tag: "سؤال مقالي (ص 6, 7)", q: "س8/ قارن بين المداخل الأربعة لتعريف النقود.", ans: "<ul><li><span class='key-highlight'>1. المدخل المادي:</span> ركز على الشكل والورق والمعدن. عيبه: ضيق النطاق وتجاهل الأنواع الأخرى.</li><li><span class='key-highlight'>2. المدخل الفني:</span> أداة للتخلص من المقايضة. عيبه: لم يوضح أساس عملها.</li><li><span class='key-highlight'>3. المدخل القانوني:</span> القدرة على إبراء الذمة. عيبه: اختلف مع الاقتصاديين الذين اكتفوا بالقبول العام.</li><li><span class='key-highlight'>4. المدخل الوظيفي:</span> أي شيء له قبول عام للتبادل والقياس والمخزون. وهو الأشمل.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي تاريخي (ص 7)", q: "س9/ تتبع المراحل التاريخية لتطور النقود.", ans: "<ul><li>1. استخدام السلع والمعادن (مسكوكات وسبائك ذهبية).</li><li>2. إيصالات الصاغة (كبديل عن حمل الذهب).</li><li>3. التدخل الحكومي لتنظيم النقود الورقية.</li><li>4. الودائع المصرفية والشيكات كشكل حديث للنقود.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي رياضي (ص 8, 9)", q: "س10/ كيف ساهمت النقود بتقليص القيم التبادلية لـ 10 سلع؟", ans: "<p>قانون المقايضة: [ ن × (ن - 1) ] ÷ 2</p><ul><li>في المقايضة: (10 × 9) ÷ 2 = <span class='key-highlight'>45 قيمة تبادلية</span>.</li><li>في النقود: يتقلص العدد إلى <span class='key-highlight'>10 أسعار نقدية فقط</span>.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي (ص 3)", q: "س11/ ما المقصود باقتصاد المبادلة (المقايضة)؟ وما هي أبرز سلبياته التي أدت إلى ابتكار النقود؟", ans: "<p><strong>اقتصاد المبادلة (المقايضة):</strong> هو عملية تبادل سلع مقابل سلع أخرى أو خدمات مقابل خدمات دون تدخل أداة وسيطة موحدة (كالنقود).</p><p><strong>سلبياته (ص 3):</strong></p><ul><li>1. احتمال عدم توافق الرغبات.</li><li>2. احتمال تلف وتناقص قيم السلع بمرور الوقت.</li><li>3. وجود تكاليف نظير تخزين السلع.</li><li>4. الحاجة المستمرة لمعلومات وبيانات عن أثمان السلع.</li><li>5. ضياع الوقت والجهد في التنقل بين الأسواق.</li><li>6. صعوبة تجزئة بعض السلع والخدمات.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي (ص 4)", q: "س12/ قارن بين مفهومي (النقود السلعية) و (النقد بأمر الحكومة).", ans: "<p><span class='key-highlight'>النقود السلعية:</span> هي سلع استخدمها الإنسان للتبادل (كالذهب والفضة والمحاصيل) وتمتلك قيمة تبادلية إلى جانب قيمتها كسلعة استهلاكية.</p><p><span class='key-highlight'>النقد بأمر الحكومة (النقود الورقية):</span> هي نقود لا يمكن تحويلها إلى أي شيء آخر، وتكون قيمتها النقدية <strong>أكبر</strong> من قيمتها السوقية كسلعة، ولا تتعهد الحكومة بتحويلها، بل تكتسب قيمتها من ثقة وقبول الناس لها.</p>" },
      { cat: "lecture", tag: "سؤال مقالي (ص 8)", q: "س13/ وضح كيف أثرت وظيفة النقود كـ (أداة للتبادل) على التخصص وتقسيم العمل في المجتمع.", ans: "<p>لأن النقود تتميز بالقبول العام، فقد عملت كأداة لإتمام المعاملات وفصلت عملية البيع عن الشراء. هذا الفصل والتسهيل أدى إلى توفير الوقت والجهد المهدور في اقتصاد المقايضة (البحث عن شخص تتوافق رغباته)، مما وفر للأفراد <strong>وقتاً أكبر للتخصص في الإنتاج</strong> والقيام بالأعمال التي يتقنونها بدلاً من القيام بأعمال لا يتقنونها.</p>" },
      { cat: "lecture", tag: "سؤال مقالي (ص 9)", q: "س14/ فسر: لماذا يلجأ الأفراد للاحتفاظ بـ (الأصول الحقيقية) بدلاً من النقود في فترات التضخم؟ وما هي مخاطر ذلك؟", ans: "<p>يلجأ الأفراد للأصول الحقيقية في فترات التضخم هرباً من تدهور القيمة الحقيقية للنقود.</p><p><strong>المزايا:</strong> الأصول الحقيقية تدر عائداً (ربح، فائدة، أو ريع)، وتحقق <strong>أرباحاً رأسمالية</strong> مع استمرار ارتفاع الأسعار.</p><p><strong>المخاطر (العيوب):</strong> قد يتعرض الفرد لـ <strong>خسائر رأسمالية</strong> عند اضطراره لبيعها وتحويلها إلى أرصدة نقدية بشكل مستعجل.</p>" },
      { cat: "lecture", tag: "سؤال مقالي (ص 10)", q: "س15/ بين أثر التضخم والانكماش على وظيفة النقود كمعيار للمدفوعات الآجلة وعلى علاقة الدائن بالمدين.", ans: "<ul><li><span class='key-highlight'>في فترات التضخم (ارتفاع الأسعار):</span> تتدهور قيمة النقود، وتصبح قيمة القرض عند رده أقل من القيمة وقت التعاقد. النتيجة: <strong>يتضرر الدائن ويستفيد المدين</strong> (إعادة توزيع الثروة من الدائن للمدين).</li><li><span class='key-highlight'>في فترات الانكماش (انخفاض الأسعار):</span> ترتفع قيمة النقود، وتزيد قيمة القرض عند رده عن وقت التعاقد. النتيجة: <strong>يتضرر المدين ويستفيد الدائن</strong> (إعادة توزيع الدخل من المدين للدائن).</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي مفصل (ص 11-13)", q: "س16/ عدد الخصائص الثمانية للنقود، مع توضيح أهمية خاصيتي (الندرة) و (وحدة الأشكال).", ans: "<p><strong>الخصائص الثمانية:</strong> 1. محدودية الكمية (الندرة)، 2. صعوبة التزوير، 3. سهولة الاحتفاظ بها، 4. سهولة الحمل والنقل، 5. قوة التحمل، 6. سهولة التجزئة، 7. وحدة الأشكال (التجانس)، 8. الإصدار الحكومي.</p><ul><li><span class='key-highlight'>أهمية الندرة:</span> لتجنب التضخم وانهيار قيمة النقود، يجب أن يواكب عرضها قدرات الاقتصاد الإنتاجية.</li><li><span class='key-highlight'>أهمية وحدة الأشكال:</span> تغني الأفراد عن فحص النقود المستمر وتضمن قبولها العام دون عناء، عكس المعادن التي كانت تتطلب مختصاً لفحص نقاوتها.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي مفصل (ص 13)", q: "س17/ (النقود لا تُحسب ضمن الثروة القومية الحقيقية للمجتمع). ناقش هذه العبارة مبيناً طبيعة النقود كأصل.", ans: "<p>العبارة صحيحة. الثروة الحقيقية للمجتمع تتكون من <strong>الأصول الحقيقية فقط</strong> (السلع والمصانع والموارد). أما النقود فهي <strong>أصل نقدي ومالي</strong> (حقوق دفترية أو وعود بالدفع). احتسابها ضمن ثروة المجتمع سيؤدي لازدواج مبالغ فيه للثروة. التغير في كمية النقود لا يغير حجم الثروة الحقيقية بل يغير <strong>كيفية توزيعها</strong> بين الأفراد.</p>" },
      { cat: "lecture", tag: "سؤال مقالي مفصل (ص 14)", q: "س18/ وضح العلاقة بين (السيولة) و (العائد)، مبيناً التضحية التي يقدمها الفرد عند احتفاظه بالنقود السائلة.", ans: "<p>هناك علاقة <strong>عكسية</strong> بين سيولة الأصل والعائد الذي يدره. النقود تمتلك سيولة 100% (قدرة فورية على الشراء) ولكنها لا تدر أي دخل بذاتها. بالتالي، عندما يقرر الفرد الاحتفاظ بثروته كنقود سائلة، فإنه يقدم <span class='key-highlight'>تضحية بتيار من الدخل (فائدة أو ربح)</span> كان يمكن أن يحصل عليه لو اشترى أصولاً أقل سيولة كالأسهم، السندات، أو العقارات.</p>" },
      { cat: "lecture", tag: "سؤال مقالي مفصل (ص 15-16)", q: "س19/ ماذا يتضمن مقياس (M1) لعرض النقود؟ وما هي البنود التي يتعمد هذا المقياس استبعادها ولماذا؟", ans: "<p><strong>يتضمن M1 (وسائل الدفع):</strong> العملة المتداولة خارج البنوك + الودائع الجارية الخاصة (تحت الطلب).</p><p><strong>البنود المستبعدة وأسبابها:</strong></p><ul><li><span class='key-highlight'>1. احتياطيات البنوك لدى البنك المركزي:</span> لمنع الازدواج في الحساب.</li><li><span class='key-highlight'>2. النقدية لدى وزارة المالية:</span> لأنها ليست في التداول المباشر.</li><li><span class='key-highlight'>3. الودائع الحكومية:</span> لأنها لا تمثل قوة شرائية آنية تطالب بسلع وخدمات السوق الخاص فوراً ضمن هذا المفهوم الضيق.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي مفصل (ص 17-18)", q: "س20/ ما هي مبررات الاقتصاديين لاعتماد (مفهوم السيولة M2) بدلاً من الاكتفاء بـ M1؟", ans: "<p>يستند أنصار M2 على المبررات التالية:</p><ul><li><span class='key-highlight'>1. وجود أشباه نقود:</span> هناك أصول مالية (كالودائع الآجلة والادخارية) تتمتع بدرجة سيولة عالية ويمكن تحويلها لنقود جارية بسهولة لتؤثر في السوق.</li><li><span class='key-highlight'>2. تحقيق الرقابة الفعالة:</span> الدافع من قياس النقود هو سيطرة السلطات النقدية لتحقيق الاستقرار، لذا يجب ألا يقتصر القياس على الحسابات الجارية فقط بل يشمل كل الأصول السائلة الخاضعة لإدارة السياسة النقدية والتي يرتبط حجمها بالنشاط الاقتصادي.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي مفصل (ص 18-19)", q: "س21/ لماذا يُعد المقياس (M3) هو الأوسع والأكثر شمولاً (إجمالي السيولة المحلية)؟ وماذا يضيف على M2؟", ans: "<p>لأنه يعالج قصور M2 الذي تجاهل ودائع مهمة ستتحول لوسائل دفع مستقبلاً. يضيف M3 المكونات التالية إلى M2:</p><ul><li><span class='key-highlight'>1. الودائع الحكومية:</span> لأنها ستنصب عاجلاً أو آجلاً في الإنفاق العام.</li><li><span class='key-highlight'>2. الودائع الادخارية:</span> لدى المؤسسات المالية الأخرى (غير البنوك التجارية).</li><li><span class='key-highlight'>3. بوالص التأمين:</span> لدى شركات التأمين.</li></ul>" },
      { cat: "lecture", tag: "سؤال مقالي تطبيقي (ص 15-19)", q: "س22/ صنف الأصول التالية حسب انتمائها لمقاييس عرض النقود (M1, M2, M3): [العملات المعدنية، بوالص التأمين، الودائع الجارية الخاصة، الودائع الحكومية، شهادات الإيداع ذات الدخل الثابت].", ans: "<ul><li><strong>العملات المعدنية:</strong> تنتمي لـ M1 (وبالتالي M2 و M3).</li><li><strong>الودائع الجارية الخاصة:</strong> تنتمي لـ M1 (وبالتالي M2 و M3).</li><li><strong>شهادات الإيداع ذات الدخل الثابت:</strong> تُضاف في M2 (ولا تحسب في M1).</li><li><strong>الودائع الحكومية:</strong> تُضاف في M3 (ولا تحسب في M1 و M2).</li><li><strong>بوالص التأمين:</strong> تُضاف في M3 (ولا تحسب في M1 و M2).</li></ul>" }
    ];

    let userAnswers = {};
    let searchTimeout; // مؤقت للبحث الذكي

    function switchTab(sectionId, btn) {
      document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      btn.classList.add('active');
    }

    // دالة للبحث الذكي وتجنب البطء في الهواتف
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        renderMCQs();
      }, 300);
    }

    function renderMCQs() {
      const search = document.getElementById('mcq-search').value.trim().toLowerCase();
      const pageFilter = document.getElementById('page-filter').value;
      const container = document.getElementById('mcq-container');
      const letters = ['أ', 'ب', 'ج', 'د'];

      const filtered = mcqData.filter(item => {
        const matchPage = pageFilter === 'all' || item.page === pageFilter;
        const matchSearch = item.q.toLowerCase().includes(search) || item.exp.toLowerCase().includes(search) || item.options.some(o => o.toLowerCase().includes(search));
        return matchPage && matchSearch;
      });

      // رسالة توضيحية عند عدم وجود نتائج للبحث
      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem;">لا توجد أسئلة تطابق بحثك 🔍</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const answered = userAnswers.hasOwnProperty(item.id);
        const userChoice = userAnswers[item.id];

        const optionsHTML = item.options.map((opt, idx) => {
          let cls = 'opt-btn';
          if (answered) {
            if (idx === item.ans) cls += ' correct'; // الإجابة الصحيحة تلون بالأخضر دائماً
            else if (idx === userChoice && userChoice !== item.ans && userChoice !== -1) cls += ' wrong'; // إجابة المستخدم الخاطئة
          }
          return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})"><span class="opt-letter">${letters[idx]}</span><span>${opt}</span></button>`;
        }).join('');

        return `
          <div class="q-card" id="q-card-${item.id}">
            <div class="q-header">
              <span class="q-badge">سؤال #${item.id}</span>
              <span class="page-badge">📍 ${item.page}</span>
            </div>
            <div class="q-title">${item.q}</div>
            <div class="options-grid">${optionsHTML}</div>
            <div class="explanation-box ${answered ? 'show' : ''}" id="exp-${item.id}">
              <h4>💡 التفسير المرجعي:</h4><p>${item.exp}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectOption(qId, optIdx) {
      if (userAnswers.hasOwnProperty(qId)) return;
      userAnswers[qId] = optIdx;
      // حفظ الإجابات لكي لا تضيع عند تحديث الصفحة
      localStorage.setItem('mcqAnswers', JSON.stringify(userAnswers));
      updateStats();
      renderMCQs();
    }

    function updateStats() {
      let attempted = 0;
      let correct = 0;
      for (const [id, choice] of Object.entries(userAnswers)) {
        if (choice !== -1) attempted++; // لا تحتسب الأسئلة التي تم كشفها (قيمتها -1)
        const qObj = mcqData.find(x => x.id === parseInt(id));
        if (qObj && qObj.ans === choice) correct++;
      }
      
      // احتساب تقدم شريط الإنجاز بناءً على جميع الأسئلة المحلولة أو المكشوفة
      const totalProgress = Object.keys(userAnswers).length; 

      document.getElementById('score-correct').textContent = correct;
      document.getElementById('score-attempted').textContent = attempted;
      document.getElementById('score-percent').textContent = (attempted > 0 ? Math.round((correct / attempted) * 100) : 0) + '%';
      document.getElementById('progress-bar').style.width = ((totalProgress / mcqData.length) * 100) + '%';
    }

    function revealAllMCQs() {
      mcqData.forEach(item => { 
        if (!userAnswers.hasOwnProperty(item.id)) {
          userAnswers[item.id] = -1; // -1 تعني أن السؤال تم كشفه ولم يقم الطالب بحله بنفسه
        }
      });
      updateStats();
      renderMCQs();
    }

    function resetMCQs() { 
      userAnswers = {}; 
      localStorage.removeItem('mcqAnswers'); // مسح التخزين
      updateStats(); 
      renderMCQs(); 
    }

    function renderEssays() {
      const container = document.getElementById('essay-container');
      const examQs = essayData.filter(e => e.cat === 'exam');
      const lectureQs = essayData.filter(e => e.cat === 'lecture');

      let html = '';
      if (examQs.length > 0) {
        html += `<div class="essay-category-title">📌 أسئلة الامتحانات المرفقة (ص3 - ص10)</div>`;
        html += examQs.map(item => `
          <div class="essay-card exam-match">
            <div class="essay-header" onclick="this.parentElement.classList.toggle('open')">
              <div><div class="exam-tag">${item.tag}</div><div class="essay-q-text">${item.q}</div></div>
            </div>
            <div class="essay-body">${item.ans}</div>
          </div>
        `).join('');
      }
      if (lectureQs.length > 0) {
        html += `<div class="essay-category-title">📘 الأسئلة المقالية والتحليلية الشاملة (ص3 - ص19)</div>`;
        html += lectureQs.map(item => `
          <div class="essay-card">
            <div class="essay-header" onclick="this.parentElement.classList.toggle('open')">
              <div><div class="exam-tag" style="color:var(--accent-cyan); border-color:var(--accent-cyan); background:rgba(6,182,212,0.1)">${item.tag}</div><div class="essay-q-text">${item.q}</div></div>
            </div>
            <div class="essay-body">${item.ans}</div>
          </div>
        `).join('');
      }
      container.innerHTML = html;
    }

    window.onload = () => {
      // استرجاع الإجابات إذا كانت محفوظة مسبقاً
      const saved = localStorage.getItem('mcqAnswers');
      if (saved) {
        try {
          userAnswers = JSON.parse(saved);
        } catch (e) {
          userAnswers = {};
        }
      }
      
      document.getElementById('total-mcq').textContent = mcqData.length;
      updateStats();
      renderMCQs();
      renderEssays();
    };
  </script>
</body>
</html>
